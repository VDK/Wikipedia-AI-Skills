name: Command Verification

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'scripts/command-registry.json'
      - 'scripts/verify-commands.py'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'scripts/command-registry.json'
      - 'scripts/verify-commands.py'
  workflow_dispatch:

jobs:
  verify-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify CLI commands against ground-truth registry
        run: |
          python3 scripts/verify-commands.py
        env:
          PYTHONPATH: .
